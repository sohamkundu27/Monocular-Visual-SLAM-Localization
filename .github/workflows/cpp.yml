name: cpp

on:
  push:
    branches: [main, cpp-port]
  pull_request:

jobs:
  build-and-test:
    # Uses the distribution packages (OpenCV 4.6, GTSAM 4.2.0) because building
    # OpenCV 4.13 + GTSAM from source on every push is not cheap. Tests that
    # assert bit-level parity with the Python/cv2 4.13 reference skip
    # themselves when the OpenCV major.minor differs; everything else runs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libeigen3-dev libopencv-dev libgtsam-dev libboost-all-dev \
            libtbb-dev libmetis-dev libyaml-cpp-dev nlohmann-json3-dev libcli11-dev libgtest-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMVSLAM_WERROR=ON -DMVSLAM_OPENCV_MIN_VERSION=4.5
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4
