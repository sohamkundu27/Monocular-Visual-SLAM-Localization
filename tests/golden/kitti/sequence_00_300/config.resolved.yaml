dataset:
  path: /home/soham/datasets/kitti/dataset
  sequence: '00'
  camera: image_0
  max_frames: 300
  frame_step: 1
  start_frame: 0
  grayscale: true
features:
  detector: orb
  max_features: 3000
  fast_threshold: 20
  scale_factor: 1.2
  n_levels: 8
  edge_threshold: 31
  score_type: 0
  clahe: false
matcher:
  matcher: bf
  use_ratio_test: true
  ratio: 0.75
  cross_check: true
  max_distance: 64.0
  min_matches: 20
odometry:
  ransac_method: magsac
  ransac_threshold_px: 0.5
  ransac_confidence: 0.999
  ransac_max_iters: 2000
  cheirality_distance: 200.0
  min_inliers: 30
  min_inlier_ratio: 0.3
  max_rotation_deg: 30.0
  min_parallax_deg: 0.0
  min_flow_px: 0.7
  homography_ratio_threshold: 0.45
  reject_degenerate: false
  scale_source: ground_truth
  constant_scale: 0.85
  min_scale: 0.001
  max_scale: 10.0
keyframes:
  every_n_frames: 5
  min_translation_m: 2.0
  min_rotation_deg: 10.0
loop_closure:
  enabled: true
  vocabulary_size: 1024
  vocabulary_train_descriptors: 80000
  min_keyframe_separation: 30
  min_path_separation_m: 30.0
  top_k: 5
  min_similarity: 0.2
  similarity_ratio: 0.85
  min_matches: 60
  min_inliers: 40
  min_inlier_ratio: 0.35
  cooldown_keyframes: 10
  max_loops: 0
  min_scale_points: 15
  min_scale_baseline_m: 0.5
  scale_neighbour_search: 5
  min_loop_scale_m: 0.05
  max_loop_scale_m: 10.0
  require_measured_scale: true
pose_graph:
  prior_sigma_rot: 0.0001
  prior_sigma_trans: 0.0001
  odom_sigma_rot: 0.02
  odom_sigma_trans: 0.1
  loop_sigma_rot: 0.05
  loop_sigma_trans: 0.3
  robust_loop_kernel: true
  huber_k: 1.345
  optimizer: levenberg_marquardt
  max_iterations: 100
  relative_error_tol: 1.0e-05
  absolute_error_tol: 1.0e-05
  verbose: false
evaluation:
  alignment: sim3
  rpe_deltas:
  - 1
  - 10
  - 100
  drift_segment_lengths_m:
  - 100.0
  - 200.0
  - 300.0
  - 400.0
  - 500.0
  - 600.0
  - 700.0
  - 800.0
output:
  root: outputs
  run_name: sequence_{sequence}
  save_plots: true
  save_diagnostics: true
  dpi: 150
  plot_format: png
  plot_3d: true
runtime:
  seed: 0
  log_level: WARNING
  progress_interval: 250
